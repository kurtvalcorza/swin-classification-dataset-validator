[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swin-classification-dataset-validator"
version = "0.1.0"
description = "NATIVE ml-worker image-folder dataset validator for Swin image classification"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["Pillow==12.3.0"]

[project.scripts]
swin-classification-validate = "swin_classification_validator.validator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
